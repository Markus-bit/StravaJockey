<!doctype html>
<!--
  Template for frontend/public/og-image.png (the preview image shown when the site's link is shared).
  To regenerate after changing the name, colour or text: open this file in Chrome, set the window
  to 1200x630 (DevTools > device toolbar > Responsive 1200 x 630) and use "Capture screenshot",
  or with Playwright:  page.setViewportSize({width:1200,height:630}); page.screenshot({path})
  Keep --brand in sync with --brand in frontend/src/index.css.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { --brand: #fc4c02; --ink: #111827; --muted: #6b7280; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: Inter, "Inter Display", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f3f4f6;
    color: var(--ink);
  }
  /* map-like background on the right */
  .map { position: absolute; inset: 0; }
  /* text panel on the left */
  .panel {
    position: absolute; left: 0; top: 0; bottom: 0; width: 600px;
    padding: 72px 64px;
    background: linear-gradient(90deg, #fff 78%, rgba(255,255,255,0));
    display: flex; flex-direction: column; justify-content: center; gap: 28px;
  }
  .brand { display: flex; align-items: center; gap: 20px; }
  .mark {
    flex-shrink: 0; width: 84px; height: 84px; border-radius: 22px; background: var(--brand);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 28px rgba(252, 76, 2, .35);
  }
  .name { font-size: 60px; font-weight: 800; letter-spacing: -0.03em; }
  .tagline { font-size: 34px; line-height: 1.25; font-weight: 600; letter-spacing: -0.01em; }
  .tagline span { color: var(--brand); }
  .bullets { display: flex; flex-wrap: wrap; gap: 12px; }
  .bullets div {
    padding: 10px 18px; border-radius: 999px; background: #fff;
    border: 1.5px solid #e5e7eb; font-size: 22px; font-weight: 600; color: #374151;
  }
  .url { font-size: 24px; color: var(--muted); font-weight: 500; }
</style>
</head>
<body>
  <svg class="map" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="630" fill="#eef0ea"/>
    <!-- park and lake -->
    <path d="M760 40 C880 20 980 70 1010 150 C1040 230 960 280 870 270 C790 262 720 200 730 130 C735 90 740 50 760 40Z" fill="#cfe8c4"/>
    <path d="M1010 420 C1080 390 1170 420 1190 480 C1210 560 1120 610 1040 590 C980 575 950 520 965 470 C972 445 990 428 1010 420Z" fill="#bfdcf2"/>
    <!-- streets -->
    <g stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none">
      <path d="M560 120 L1200 60"/><path d="M560 330 L1200 300"/><path d="M560 520 L1200 560"/>
      <path d="M700 0 L660 630"/><path d="M900 0 L930 630"/><path d="M1100 0 L1080 630"/>
    </g>
    <g stroke="#f8e7a8" stroke-width="18" stroke-linecap="round" fill="none">
      <path d="M560 420 C760 400 860 470 1200 400"/>
    </g>
    <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none" opacity=".9">
      <path d="M800 0 L790 630"/><path d="M1000 0 L1010 630"/><path d="M560 230 L1200 190"/>
    </g>
    <!-- the route -->
    <path d="M690 560 C700 470 740 430 800 420 C870 408 900 360 905 300 C910 240 960 200 1020 210 C1080 220 1110 170 1100 110"
          fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round"/>
    <path d="M690 560 C700 470 740 430 800 420 C870 408 900 360 905 300 C910 240 960 200 1020 210 C1080 220 1110 170 1100 110"
          fill="none" stroke="#fc4c02" stroke-width="11" stroke-linecap="round"/>
    <circle cx="690" cy="560" r="16" fill="#fff"/><circle cx="690" cy="560" r="10" fill="#16a34a"/>
    <circle cx="1100" cy="110" r="16" fill="#fff"/><circle cx="1100" cy="110" r="10" fill="#fc4c02"/>
  </svg>

  <div class="panel">
    <div class="brand">
      <div class="mark">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/>
        </svg>
      </div>
      <div class="name">StravaJockey</div>
    </div>
    <div class="tagline">Draw a route, set your pace and heart rate, and download it as a <span>GPX file</span>.</div>
    <div class="bullets"><div>Run &amp; Ride</div><div>Elevation</div><div>Heart rate</div></div>
    <div class="url">stravajockey.com</div>
  </div>
</body>
</html>
